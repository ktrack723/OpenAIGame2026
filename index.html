<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PLANETPOOL</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23ffd36b'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
    <!-- three.js는 로컬 번들 사용: CDN이 막혀도 로딩이 멈추지 않는다 -->
    <!-- ?v= 쿼리는 캐시 버스팅용: GitHub Pages가 JS를 10분 캐시하므로 배포 시 새 index.html이
         옛 JS와 섞이는 것을 막는다. 배포마다 값을 올릴 것 -->
    <script type="importmap">{"imports":{"three":"./src/vendor/three.module.js?v=2"}}</script>
    <script>
      (function () {
        function fail(msg) {
          const boot = document.querySelector('.boot')
          if (boot) { boot.dataset.err = '1'; boot.textContent = '게임 로딩 실패: ' + msg + ' — 배포 직후라면 캐시 문제일 수 있습니다. 잠시 후 새로고침 해보세요.' }
        }
        // 모듈/리소스 로드 실패는 window로 버블되지 않으므로 캡처 단계에서 잡는다
        window.addEventListener('error', (e) => {
          if (e.message) fail(e.message)
          else if (e.target && (e.target.src || e.target.href)) fail('리소스를 불러오지 못함 — ' + (e.target.src || e.target.href))
          else fail('알 수 없는 오류')
        }, true)
        window.addEventListener('unhandledrejection', (e) => fail((e.reason && e.reason.message) || String(e.reason)))
        setTimeout(() => {
          const boot = document.querySelector('.boot')
          if (boot && !boot.dataset.err) boot.textContent = '아직 로딩 중… 네트워크가 느리거나 파일이 아직 배포되지 않았을 수 있습니다. 잠시 후 새로고침 해보세요.'
        }, 8000)
      })()
    </script>
  </head>
  <body>
    <div id="app" aria-label="PLANETPOOL Three.js game canvas">
      <div class="boot">PLANETPOOL 로딩 중…</div>
    </div>
    <script type="module" src="./src/main.js?v=2"></script>
  </body>
</html>
