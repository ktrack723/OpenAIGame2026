<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PLANETPOOL</title>
    <link rel="stylesheet" href="./src/style.css" />
    <!-- three.js는 로컬 번들 사용: CDN이 막혀도 로딩이 멈추지 않는다 -->
    <script type="importmap">{"imports":{"three":"./src/vendor/three.module.js"}}</script>
    <script>
      (function () {
        function fail(msg) {
          const boot = document.querySelector('.boot')
          if (boot) { boot.dataset.err = '1'; boot.textContent = '게임 로딩 실패: ' + msg }
        }
        // 모듈/리소스 로드 실패는 window로 버블되지 않으므로 캡처 단계에서 잡는다
        window.addEventListener('error', (e) => {
          if (e.message) fail(e.message)
          else if (e.target && (e.target.src || e.target.href)) fail('리소스를 불러오지 못함 — ' + (e.target.src || e.target.href))
          else fail('알 수 없는 오류')
        }, true)
        window.addEventListener('unhandledrejection', (e) => fail((e.reason && e.reason.message) || String(e.reason)))
        setTimeout(() => {
          const boot = document.querySelector('.boot')
          if (boot && !boot.dataset.err) boot.textContent = '아직 로딩 중… 네트워크에서 Three.js(esm.sh)를 받지 못하고 있을 수 있습니다. 로컬 서버(npm run serve)로 열었는지 확인하세요.'
        }, 8000)
      })()
    </script>
  </head>
  <body>
    <div id="app" aria-label="PLANETPOOL Three.js game canvas">
      <div class="boot">PLANETPOOL 로딩 중…</div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
