<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08060f" />
    <meta name="description" content="LLM 기반 연애 코칭 게임 — 당신은 연애하지 않는다, 남을 연애시킨다." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>BISHOUJO RIZZ SIMULATOR 2077</title>
    <link rel="stylesheet" href="./web/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💽</text></svg>"
    />

    <!-- three.js 는 저장소에 함께 넣어 둔다(vendor/). GitHub Pages 에서 CDN 이 막혀도
         화면은 뜨게 하려는 것이고, 빌드 단계도 필요 없다. -->
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.min.js"
        }
      }
    </script>

    <script>
      // 모듈 로드 실패는 window 로 버블되지 않으므로 캡처 단계에서 잡는다.
      window.addEventListener(
        'error',
        (e) => {
          const boot = document.getElementById('boot')
          if (!boot) return
          const msg = e.message || (e.target && (e.target.src || e.target.href)) || '알 수 없는 오류'
          boot.textContent = '로딩 실패: ' + msg
          boot.style.color = '#ff6b6b'
        },
        true,
      )
    </script>
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div id="ui">
      <div id="hud"></div>
      <div id="panel" class="center">
        <div id="boot" style="color: #9d95c4">단말기 부팅 중…</div>
      </div>
    </div>

    <script type="module" src="./web/main.js"></script>
  </body>
</html>
